<!doctype html>
<!-- Netlify Forms skeleton: registers the "lead" form at deploy time. The quiz (src/components/Hero.astro)
     posts here with the same field names; keep them in sync with FORM_FIELDS in src/lib/forms.ts. -->
<html lang="pt-BR">
<head><meta charset="utf-8" /><meta name="robots" content="noindex" /><title>lead</title></head>
<body>
<form name="lead" data-netlify="true" hidden>
  <input type="hidden" name="form-name" value="lead" />
  <input type="hidden" name="lead_id" />
  <input name="segment" />
  <input name="venda" />
  <input name="faixa" />
  <input name="cargo" />
  <input name="nome" />
  <input type="email" name="email" />
  <input name="telefone" />
  <input name="empresa" />
  <input type="hidden" name="search" />
  <input type="hidden" name="page_url" />
</form>
</body>
</html>
